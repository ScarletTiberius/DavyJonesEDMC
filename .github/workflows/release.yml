name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify PLUGIN_VERSION matches tag
        run: |
          TAG="${{ github.ref_name }}"
          EXPECTED="${TAG#v}"
          ACTUAL=$(grep -oP '(?<=^PLUGIN_VERSION = ")[^"]+' load.py)
          if [ -z "$ACTUAL" ]; then
            echo "::error::Could not find PLUGIN_VERSION in load.py"
            exit 1
          fi
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::load.py has PLUGIN_VERSION = \"$ACTUAL\" but the tag is \"$TAG\" (expected \"$EXPECTED\"). Update PLUGIN_VERSION in load.py, commit, and re-tag."
            exit 1
          fi
          echo "PLUGIN_VERSION ($ACTUAL) matches tag ($TAG)"

      - name: Build zip
        run: |          
          mkdir -p dist/build/DavyJones
          
          rsync -av \
          --exclude='.git' \
          --exclude='.github' \
          --exclude='.gitignore' \
          --exclude='.gitattributes' \
          --exclude='__pycache__' \
          --exclude='dist' \
          --exclude='*.pyc' \
          --exclude='.venv' \
          --exclude='venv' \
          --exclude='.pytest_cache' \
          --exclude='.mypy_cache' \
          ./ dist/build/DavyJones/
          
          # Zip from the build directory
          cd dist/build
          zip -r ../DavyJones-${{ github.ref_name }}.zip DavyJones/

      - name: Verify archive
        run: |
          ls -lah dist
          unzip -l dist/DavyJones-${{ github.ref_name }}.zip | head -50

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: dist/DavyJones-${{ github.ref_name }}.zip
